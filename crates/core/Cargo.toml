[package]
name = "csvscope-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
csv = "1"
csv-core = "=0.1.13"
duckdb = { version = "=1.20000.2", features = ["bundled", "appender-arrow"] }
arrow = { version = "60.1.0", default-features = false, features = ["ipc"] }
encoding_rs = "=0.8.44"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
same-file = "1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
